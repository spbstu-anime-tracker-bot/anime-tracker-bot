spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: anime-tracker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.animetracker.recommendation"
        spring.json.value.default.type: "com.animetracker.recommendation.RecommendationRequestEvent"

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:your-token-here}
    username: ${TELEGRAM_BOT_USERNAME:your-bot-username}

ollama:
  api:
    url: ${OLLAMA_URL:http://host.docker.internal:11434/api/generate}
    model: ${OLLAMA_MODEL:gemma3}
    timeout-seconds: 120

gigachat:
  api:
    auth-key: ${GIGACHAT_AUTH_KEY:}
    model: ${GIGACHAT_MODEL:GigaChat}
    scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

admin:
  token: ${ADMIN_API_TOKEN:admin-secret-token}

kafka:
  topics:
    recommendation-requests: recommendation.requests
    recommendation-results: recommendation.results

logging:
  level:
    com.animetracker: INFO
    org.hibernate.SQL: WARN
